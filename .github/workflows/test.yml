name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Bowtie
        uses: bowtie-json-schema/bowtie@v2026.2.4

      - name: Validate
        run: bash scripts/validate.sh

  optimize:
    runs-on: ubuntu-latest
    # `dicebear <file> --optimize-check` re-runs the CLI's svgo pass and reports
    # whether the committed definition is already as small as that pass makes
    # it. A hand edit or an older Figma export can leave path data behind that
    # the pass would strip, which costs every consumer bandwidth but renders the
    # same picture. So this annotates the files it finds and lets the run stay
    # green, unlike the codegen jobs below, where stale output ships a broken
    # package.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the DiceBear CLI
        run: npm install --global dicebear@10

      - name: Report definitions the svgo pass would still shrink
        continue-on-error: true
        run: |
          stale=()
          total=0

          for file in src/*.json; do
            total=$((total + 1))
            if ! dicebear "$file" --optimize-check; then
              stale+=("$file")
            fi
          done

          if [ ${#stale[@]} -eq 0 ]; then
            echo "All $total definitions are already optimized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### The svgo pass would still shrink ${#stale[@]} of $total definitions"
            echo
            for file in "${stale[@]}"; do echo "- \`$file\`"; done
            echo
            echo 'Rewrite them with `npx dicebear <file> --optimize`.'
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${stale[@]}"; do
            echo "::warning file=$file::The svgo pass would still shrink this definition. Run: npx dicebear $file --optimize"
          done

          exit 1

  rust-codegen:
    runs-on: ubuntu-latest
    # styles.rs and the Cargo.toml [features] table are generated from
    # src/*.json by scripts/build.sh and committed. Adding a style without
    # regenerating them would silently publish a crate missing that style —
    # `cargo check` can't see a style that isn't listed — so fail the PR if the
    # committed files are stale. (Only the deterministic, ASCII Rust outputs are
    # checked; the locale-sensitive LICENSE.md padding is not.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate the Rust crate from src/
        run: bash scripts/build.sh

      - name: Fail if styles.rs or Cargo.toml is out of sync with src/
        run: git diff --exit-code -- styles.rs Cargo.toml

  go:
    runs-on: ubuntu-latest
    # styles.go is generated from src/*.json by scripts/build.sh and committed.
    # Adding a style without regenerating it would silently publish a Go module
    # missing that style, so fail the PR if the committed file is stale, then
    # confirm the module builds and the embeds resolve.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Regenerate styles.go from src/
        run: bash scripts/build.sh

      - name: Fail if styles.go is out of sync with src/
        run: git diff --exit-code -- styles.go

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

  dart:
    runs-on: ubuntu-latest
    # lib/ is generated from src/*.json by scripts/build.sh and git-ignored,
    # like the minified npm dist/. Only the pub.dev publish ships it, built
    # fresh, so there is no drift to check. Generate it here, then prove every
    # embedded constant is byte-identical to its src/ JSON (this guards the
    # generator's string escaping) and that the package analyzes cleanly.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Generate lib/ from src/
        run: bash scripts/build.sh

      - name: Analyze
        run: |
          dart pub get
          dart analyze --fatal-infos

      - name: Verify byte parity with src/
        run: dart run tool/check_parity.dart

  csharp:
    runs-on: ubuntu-latest
    # styles.cs is generated from src/*.json by scripts/build.sh and committed,
    # like the other language shims, so a style added without regenerating it
    # would ship inside the assembly but stay invisible to callers. Fail the PR
    # if the committed file is stale, then build the package and read every
    # style back out of it. MSBuild embeds the JSON verbatim, so unlike the Dart
    # shim there is no escaping to guard, but the wiring can still break: a
    # renamed file, or a LogicalName that no longer matches what styles.cs
    # looks up.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Regenerate styles.cs from src/
        run: bash scripts/build.sh

      - name: Fail if styles.cs is out of sync with src/
        run: git diff --exit-code -- styles.cs

      - name: Build
        run: dotnet build DiceBear.Styles.csproj --configuration Release

      - name: Verify byte parity with src/
        run: dotnet run --project tool/CheckParity

      - name: Pack
        # dotnet build leaves the packaging inputs unresolved, so a Pack item
        # pointing at a missing file (LICENSE.md, README.md) stays invisible
        # until the release packs, by which point npm is already published.
        # Packing here turns that into a red pull request instead.
        run: dotnet pack DiceBear.Styles.csproj --configuration Release --output dist-nuget
