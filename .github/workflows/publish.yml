name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Bowtie
        uses: bowtie-json-schema/bowtie@v2026.2.4

      - name: Test
        run: bash scripts/validate.sh

      - name: Build
        run: bash scripts/build.sh

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --provenance --tag ${{ steps.npm-tag.outputs.tag }}

  publish-pypi:
    runs-on: ubuntu-latest
    # Runs after the npm job so the shared JSON validation (validate.sh) has
    # passed before anything is pushed to PyPI.
    needs: publish
    permissions:
      contents: read # actions/checkout (a permissions block defaults the rest to none)
      id-token: write # Trusted Publishing to PyPI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distribution
        # Build into a dedicated directory so the wheel/sdist never mix with the
        # npm `dist/` (which holds the minified *.min.json).
        run: pipx run build --outdir dist-python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python

  publish-crates:
    runs-on: ubuntu-latest
    # Runs after the npm job so the shared JSON validation (validate.sh) has
    # passed before anything is pushed to crates.io. Unlike npm/PyPI, the Rust
    # crate embeds the committed src/ JSON directly (include_str!), so no build
    # step is needed.
    needs: publish
    permissions:
      contents: read # actions/checkout
      id-token: write # Trusted Publishing to crates.io (OIDC, no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify every style embeds and compiles
        run: cargo check --all-features

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pub:
    runs-on: ubuntu-latest
    # Runs after the npm job so the shared JSON validation (validate.sh) has
    # passed before anything is pushed to pub.dev. lib/ is generated from
    # src/*.json and git-ignored (the Dart counterpart of the npm-only dist/),
    # so it is built fresh here before publishing. Authentication uses pub.dev's
    # GitHub Actions integration (OIDC via setup-dart, no stored token),
    # configured on pub.dev with this repository and the tag pattern
    # v{{version}}.
    needs: publish
    permissions:
      contents: read # actions/checkout
      id-token: write # Automated publishing to pub.dev (OIDC, no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Build
        run: bash scripts/build.sh

      - name: Publish
        run: dart pub publish --force

  publish-nuget:
    runs-on: ubuntu-latest
    # Runs after the npm job so the shared JSON validation (validate.sh) has
    # passed before anything is pushed to NuGet. styles.cs is committed and the
    # csproj embeds the committed src/ JSON directly, so nothing has to be
    # generated first. Authentication uses NuGet.org's Trusted Publishing (OIDC,
    # no stored token), which needs a trusted publishing policy configured on
    # nuget.org for this repository and this workflow.
    needs: publish
    permissions:
      contents: read # actions/checkout
      id-token: write # Trusted Publishing to NuGet.org (OIDC, no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify the embedded styles match src/
        run: dotnet run --project tool/CheckParity

      - name: Pack
        run: dotnet pack DiceBear.Styles.csproj --configuration Release --output dist-nuget

      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          # The NuGet.org account that created the trusted publishing policy,
          # not the organization that owns the package. Passing the owner fails
          # the token exchange with a 401.
          user: FlorianKoerner

      - name: Publish
        run: dotnet nuget push "dist-nuget/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
